services:
  frontend-tests:
    image: node:24-alpine
    working_dir: /tmp/frontend
    volumes:
      - ./frontend:/source:ro
    command:
      - sh
      - -ec
      - |
        mkdir -p /tmp/frontend
        cp /source/package.json /source/package-lock.json /source/tsconfig*.json /source/vite*.ts /source/eslint.config.js /source/index.html .
        cp -r /source/src .
        npm ci
        npm run test:coverage
        npm run lint
        npm run build
  backend-tests:
    image: python:3.12-slim
    working_dir: /tmp/project
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      REQUIRE_DATABASE_TESTS: '1'
    volumes:
      - ./backend:/source/backend:ro
      - ./pytest.ini:/source/pytest.ini:ro
      - ./supabase:/source/supabase:ro
    command:
      - sh
      - -ec
      - |
        mkdir -p backend
        cp /source/pytest.ini .
        cp /source/backend/requirements*.txt backend/
        cp -r /source/backend/app /source/backend/tests backend/
        cp -r /source/supabase .
        pip install --no-cache-dir -r backend/requirements-dev.txt
        apt-get update
        apt-get install -y --no-install-recommends postgresql
        chown -R postgres:postgres /tmp/project
        export PATH="$$(pg_config --bindir):$$PATH"
        runuser -u postgres -- python -m pytest
